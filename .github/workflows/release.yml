# Builds ClipVault.exe and publishes a GitHub release whenever a version tag (v1.2.3) is pushed.
# Installed copies of ClipVault find the new release and update themselves.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not (Select-String -Path Cargo.toml -SimpleMatch "version = `"$version`"" -Quiet)) { throw "Cargo.toml's version differs from the tag" }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/clipvault.exe out/ClipVault.exe
          $hash = (Get-FileHash out/ClipVault.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content out/ClipVault.exe.sha256 "$hash  ClipVault.exe" -NoNewline

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/ClipVault.exe out/ClipVault.exe.sha256 `
            --title "ClipVault ${{ github.ref_name }}" --notes-from-tag
